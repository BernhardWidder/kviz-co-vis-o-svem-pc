<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kvíz - Co všechno víš o svém PC?</title>
    <!-- vsechny styly jsou v style.css -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="okno">

    <!--hlavni okno = start -->
    <div id="start">
        <h1>Co všechno víš o svém PC?</h1>
        <p>Otestuj si, co víš o hardwaru, softwaru a periferiích.</p>
        <button id="btn-start">Začít test</button>
    </div>

    <!-- otazky -->
    <div id="kviz" class="skryte">
        <p id="pocitadlo"></p>
        <h2 id="otazka"></h2>
        <div id="odpovedi"></div>
        <button id="btn-dalsi" class="skryte">Další</button>
    </div>

    <!-- vysledek -->
    <div id="vysledek" class="skryte">
        <h1>Vyhodnocení</h1>
        <p id="skore"></p>
        <div id="chyby"></div>
        <button id="btn-znovu">Zkusit znovu</button>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
