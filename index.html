<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kvíz - Co všechno víš o svém PC?</title>
    <!--style pro hlavni page-->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            margin: 0;
            padding: 20px;
        }

        .okno {
            max-width: 600px;
            margin: 40px auto;
            background-color: #d6d6d6;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
        }

        h1 {
            color: #14c81e;
        }

        .skryte {
            display: none;
        }

        button {
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 12px 25px;
            margin: 5px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #001fb4;
        }
    </style>
</head>
<body>

<div class="okno">

    <!--hlavni okno = start -->
    <div id="start">
        <h1>Co všechno víš o svém PC?</h1>
        <p>Otestuj si, co víš o hardwaru, softwaru a periferiích.</p>
        <button id="btn-start">Začít test</button>
    </div>

    <!-- otazky -->
    <div id="kviz" class="skryte">
        <p id="pocitadlo">Otázka 1 / 10</p>
        <h2 id="otazka"></h2>
        <div id="odpovedi"></div>
        <button id="btn-dalsi" class="skryte">Další</button>
    </div>

    <!-- vysledek -->
    <div id="vysledek" class="skryte">
        <h1>Vyhodnocení</h1>
        <p id="skore"></p>
        <button id="btn-znovu">Zkusit znovu</button>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
